# Development overlay. Activate with `./gradlew bootRun --args='--spring.profiles.active=dev'`
# or SPRING_PROFILES_ACTIVE=dev. It overlays application.yml rather than replacing it,
# so anything not mentioned here keeps its production value.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wisper
    hikari:
      # One developer, one browser. A small pool makes a connection leak show up as a
      # hang in the first minute instead of an hour into the afternoon.
      maximum-pool-size: 8

db-scheduler:
  # Faster feedback when clicking "deploy" during development. In production this is a
  # pointless amount of polling.
  polling-interval: 1s
  threads: 4

wisper:
  storage:
    root: ./var/dev
  node:
    # Nothing is behind a flaky tunnel on a laptop, and waiting a minute to notice a
    # node you just killed is tedious.
    heartbeat-timeout: 20s

logging:
  level:
    lhqm.furimeo.wisper: DEBUG
    # Every statement Spring Data JDBC issues, with its bound parameters. Loud, and the
    # fastest way to see why a repository method returned nothing.
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.springframework.security: DEBUG
