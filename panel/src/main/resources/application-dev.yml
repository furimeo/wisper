# Development overlay. Activate with `./gradlew bootRun --args='--spring.profiles.active=dev'`
# or SPRING_PROFILES_ACTIVE=dev. It overlays application.yml rather than replacing it,
# so anything not mentioned here keeps its production value.

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/wisper
    hikari:
      # One developer, one browser. A small pool makes a connection leak show up as a
      # hang in the first minute instead of an hour into the afternoon.
      maximum-pool-size: 8

db-scheduler:
  # Faster feedback when clicking "deploy" during development. In production this is a
  # pointless amount of polling.
  polling-interval: 1s
  threads: 4

wisper:
  crypto:
    keys:
      # A fixed key so a developer's database survives a restart without anyone having to
      # export an environment variable first. It is in a committed file, which means it is
      # public, which means it protects nothing - that is the trade for a laptop and it is
      # never the trade for a node with a customer on it. Production reads
      # WISPER_CRYPTO_KEY_1 from the environment and refuses to start without it.
      1: d2lzcGVyLWRldi1rZXktbm90LWEtc2VjcmV0LTAwMDE=

  storage:
    root: ./var/dev
  node:
    # Nothing is behind a flaky tunnel on a laptop, and waiting a minute to notice a
    # node you just killed is tedious. Both values move together: the interval has to stay
    # comfortably inside the timeout or one dropped beat marks a healthy node lost, and
    # NodeSettings refuses to start when it does not.
    heartbeat-timeout: 20s
    heartbeat-interval: 5s

logging:
  level:
    lhqm.furimeo.wisper: DEBUG
    # Every statement Spring Data JDBC issues, with its bound parameters. Loud, and the
    # fastest way to see why a repository method returned nothing.
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.springframework.security: DEBUG
