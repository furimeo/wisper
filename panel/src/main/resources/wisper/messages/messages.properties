# The panel's own sentences: everything the server writes rather than the browser.
#
# This file is the English catalogue and the fallback for every other one. A key missing
# from messages_vi.properties resolves here, so a half-finished translation degrades to
# English rather than to a raw key on somebody's screen.
#
# Keys are dotted and named after the package that raises them, so a message can be traced
# back to its call site without a search.

# Bean Validation defaults, so a blank field reads like the rest of the panel.
jakarta.validation.constraints.NotBlank.message=This cannot be empty.
jakarta.validation.constraints.NotNull.message=Choose a value.
jakarta.validation.constraints.Size.message=Keep this between {min} and {max} characters.
jakarta.validation.constraints.PositiveOrZero.message=This is zero or more.

# Signing in.
auth.signin.failed=That email and password do not match an account.
auth.signin.locked=Too many wrong passwords. Try again after {0}.
auth.signin.suspended=This account is suspended. Ask a platform operator.
auth.locale.changed=The panel is now in {0}.

# Shared refusals.
error.notFound=There is no {0} here.
error.permissionDenied=Your role does not allow that.
error.quotaExceeded=Your plan does not include {0}.
