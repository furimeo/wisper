// The web file manager: the only way a customer touches their disk.
//
// There is no SSH, no SFTP and no WebDAV in wisper, so this contract has to be good
// enough to replace all three (design section 8.2). Two properties shape everything
// below.
//
// First, paths. Every operation names a FileRoot by id and a path relative to it. The
// panel never learns and never sends an absolute path on the node; the node resolves
// the root and rejects anything that escapes it. Path traversal is the largest attack
// surface in v1, so there is exactly one place to check it and one error code for it.
//
// Second, mobile. Most customers upload from a phone on mobile data, so an upload is a
// series of acknowledged chunks against a session that survives losing signal, not one
// enormous request that has to start again. The resume query answers with the ranges
// already on disk, and the browser continues from the first gap.
//
// Direction: the node opens the FileOp stream because it is the only side that can dial.
// The panel then drives it - FileRequest travels down to the node, FileEvent comes back
// up - which is why the RPC's request type is the answer type and not the other way
// round.
//
// Over 300 lines, and one vocabulary: splitting the upload half from the browsing half
// would put the shared chunk, the shared paths and the shared error codes in a third
// file that neither of the other two owns.
syntax = "proto3";

package wisper.v1;

option java_package = "lhqm.furimeo.wisper.proto.v1";
option java_multiple_files = true;
option java_outer_classname = "FilesProto";
option go_package = "github.com/furimeo/wisper/sasayaki/internal/wisperpb;wisperpb";

import "google/protobuf/timestamp.proto";

// One operation the panel wants performed, travelling from panel to node.
message FileRequest {
  // Correlates every FileEvent that answers this operation. Unique per node stream;
  // the panel reuses nothing, so a late answer to a cancelled request is discardable
  // rather than confusing.
  string request_id = 1;
  // Which FileRoot from the NodeSpec. A root the spec does not list is refused even if
  // the node could reach it.
  string root_id = 2;
  oneof op {
    ListDirectory list = 3;
    StatPath stat = 4;
    ReadFile read = 5;
    WriteChunk write = 6;
    ResumeUpload resume = 7;
    CompleteUpload complete = 8;
    AbortUpload abort = 9;
    CreateDirectory create_directory = 10;
    MovePath move = 11;
    DeletePath delete = 12;
    ChangeMode change_mode = 13;
    CreateArchive archive = 14;
    ExtractArchive extract = 15;
    MeasureDirectory measure = 16;
    CancelRequest cancel = 17;
  }
}

// One answer, travelling from node to panel. Several may answer one request: a download
// is many chunks, a listing is one page.
message FileEvent {
  string request_id = 1;
  oneof result {
    DirectoryListing listing = 2;
    FileInfo info = 3;
    FileChunk chunk = 4;
    UploadAck ack = 5;
    UploadState state = 6;
    DirectorySize size = 7;
    // Terminates an operation that produces nothing else - a delete, a chmod, a
    // cancel. Without it the panel cannot tell "done" from "still working".
    OperationDone done = 8;
    // Terminates an operation that failed. Always the last event for its request.
    FileError error = 9;
  }
}

// One page of a directory.
//
// Paged because a customer with a node_modules directory has a hundred thousand
// entries, and a phone that is sent all of them renders nothing at all. Entries always
// come back directories first and then by name, so the cursor stays stable between
// pages.
message ListDirectory {
  string path = 1;
  // Opaque, from the previous page's next_cursor. Empty starts at the beginning.
  string cursor = 2;
  int32 page_size = 3;
  // Dotfiles are hidden by default because the customer's own files are what they came
  // to see, and a toggle is one tap.
  bool include_hidden = 4;
}

message DirectoryListing {
  string path = 1;
  repeated FileInfo entries = 2;
  // Empty when this was the last page.
  string next_cursor = 3;
  // Total in the directory, so the UI can say "showing 200 of 40,312" rather than
  // implying the list is complete.
  int32 total_entries = 4;
}

// One directory entry, or the answer to a stat.
message FileInfo {
  // The entry's own name, without any path.
  string name = 1;
  // Relative to the root, so the panel can build the next request without joining
  // strings itself and getting `..` wrong.
  string path = 2;
  bool directory = 3;
  int64 size_bytes = 4;
  // POSIX permission bits only, as an octal value in the low nine bits. The file
  // manager shows and edits these; the type bits are already in `directory`.
  uint32 mode = 5;
  google.protobuf.Timestamp modified_at = 6;
  // Reported, never followed. A symlink in a customer volume that points outside the
  // root is shown as a symlink and refused as a target - following it is the traversal
  // hole that a path check alone does not close.
  bool symlink = 7;
  string symlink_target = 8;
  uint32 uid = 9;
  uint32 gid = 10;
}

message StatPath {
  string path = 1;
}

// Read a file, or part of one.
//
// The range exists for two different reasons: a download that resumes after the
// customer's connection dropped, and the inline editor, which opens the first megabyte
// of a large log rather than refusing to show it.
message ReadFile {
  string path = 1;
  int64 offset = 2;
  // 0 means to the end of the file.
  int64 max_bytes = 3;
}

// A run of bytes, used by downloads coming up and uploads going down. One message type
// for both directions because the framing problem is identical and two would drift.
message FileChunk {
  // Byte offset in the whole file. Authoritative for a download; cross-checked against
  // chunk_index for an upload, because a resumed upload that trusts a client-supplied
  // offset can be made to write anywhere in the file.
  int64 offset = 1;
  // offset / UploadSession.chunk_size. The identity the resume query answers in, and
  // what makes a retried chunk idempotent instead of a duplicate.
  int64 chunk_index = 2;
  bytes data = 3;
  // Last chunk of this transfer. For a download it ends the stream of events; for an
  // upload it is a hint, and CompleteUpload is what actually finishes the file.
  bool last = 4;
  // Hex SHA-256 of `data`. Mobile networks corrupt more than they are given credit for,
  // and a bad chunk that is silently accepted becomes a corrupt file that the customer
  // discovers weeks later.
  string sha256 = 5;
}

// The upload this chunk belongs to. Repeated on every chunk rather than opened once,
// because the node may have restarted between chunks and has to be able to rebuild the
// session from what is on disk plus this message.
message UploadSession {
  // Minted by the browser and carried by the panel. Survives a reload, which is what
  // makes "resume" mean anything to a customer who lost signal in a lift.
  string session_id = 1;
  // Destination, relative to the root.
  string path = 2;
  // From the browser's File.size. Lets the node reject an upload that cannot fit in the
  // quota before it writes the first byte, instead of half way through.
  int64 total_bytes = 3;
  // Hex SHA-256 of the whole file, verified at CompleteUpload. A resumed upload that
  // picked up a different version of the file fails loudly here rather than producing a
  // plausible-looking corrupt result.
  string content_sha256 = 4;
  // Bytes per chunk, from wisper.files.upload-chunk-size. Echoed so the node can derive
  // an offset from a chunk index without trusting the offset it was sent.
  int64 chunk_size = 5;
  // Overwrite an existing file. False makes an accidental re-upload an error the
  // customer sees instead of a file they lose.
  bool overwrite = 6;
}

// One chunk of an upload. Saving an edited file from the inline editor is a one-chunk
// session, so there is no second write path that has to stay consistent with this one.
message WriteChunk {
  UploadSession session = 1;
  FileChunk chunk = 2;
}

// "What do you already have?" - asked before the first chunk of a resumed upload.
message ResumeUpload {
  string session_id = 1;
}

// What the node has on disk for a session. Ranges rather than a count because chunks
// can be uploaded in parallel and a dropped connection leaves holes, not a clean
// prefix.
message UploadState {
  string session_id = 1;
  // Coalesced and sorted. The browser resumes at the first gap.
  repeated ByteRange received = 2;
  int64 total_bytes = 3;
  // Sum of the ranges, so a progress bar does not have to add them up.
  int64 received_bytes = 4;
  // When the partial upload will be swept (RetentionPolicy.orphan_upload_ttl_seconds).
  // The UI can warn instead of the customer finding the resume gone.
  google.protobuf.Timestamp expires_at = 5;
  // False when the node has never heard of this session: the sweeper already took it,
  // or it was started against a different node. The browser starts again from zero.
  bool known = 6;
}

// Half-open, like every other range in this contract: start is included, end is not.
message ByteRange {
  int64 start = 1;
  int64 end_exclusive = 2;
}

// Acknowledges one chunk. The browser waits for this before releasing the chunk from
// memory, which is what stops a phone from buffering a 2 GB file it cannot hold.
message UploadAck {
  string session_id = 1;
  int64 chunk_index = 2;
  int64 received_bytes = 3;
  // Where the node wants the next chunk. Usually the end of this one; different when
  // the node already had a later chunk and is telling the client to skip ahead.
  int64 next_offset = 4;
}

// Assemble the chunks, verify the checksum, move the file into place. Separate from the
// last chunk because assembly can fail - a checksum mismatch, a quota that filled while
// the upload was in flight - and that failure has to be reportable.
message CompleteUpload {
  string session_id = 1;
}

// The customer pressed cancel, or navigated away. Deletes the parts now rather than
// leaving them for the sweeper.
message AbortUpload {
  string session_id = 1;
}

message CreateDirectory {
  string path = 1;
  // Create missing parents. The file manager's "new folder" only ever needs one level;
  // an extract needs all of them.
  bool parents = 2;
}

// Rename and move are the same operation, and separating them produces two code paths
// with one bug each.
message MovePath {
  string from = 1;
  string to = 2;
  bool overwrite = 3;
}

message DeletePath {
  string path = 1;
  // Required for a non-empty directory. Deleting a tree by accident because the flag
  // defaulted to true is not recoverable: there is no trash on the node.
  bool recursive = 2;
}

message ChangeMode {
  string path = 1;
  // Octal permission bits in the low nine, as shown in the UI.
  uint32 mode = 2;
  // Apply to everything underneath. Directories usually need different bits from files,
  // so the node applies the execute bit to directories only.
  bool recursive = 3;
}

enum ArchiveFormat {
  ARCHIVE_FORMAT_UNSPECIFIED = 0;
  ARCHIVE_FORMAT_ZIP = 1;
  ARCHIVE_FORMAT_TAR_GZ = 2;
}

// Compress in place, on the node. Doing it here rather than in the browser is the whole
// point: a customer on a phone can package a directory they could never download first.
message CreateArchive {
  repeated string paths = 1;
  // Destination archive, relative to the root.
  string destination = 2;
  ArchiveFormat format = 3;
}

// Unpack in place. Entry paths are resolved and checked against the root exactly like
// any other path - an archive full of `../../etc` entries is the oldest trick there is.
message ExtractArchive {
  string archive_path = 1;
  string destination_directory = 2;
  bool overwrite = 3;
}

// "How big is this folder?" - the question a customer asks when their quota is full.
// A separate operation because it walks the tree, which a listing must not do.
message MeasureDirectory {
  string path = 1;
}

message DirectorySize {
  string path = 1;
  int64 bytes = 2;
  int64 file_count = 3;
  int64 directory_count = 4;
  // The walk hit its budget and stopped. An answer marked approximate is more useful
  // than a request that never returns.
  bool approximate = 5;
}

// Stop an operation that is still running: the customer closed the download, or moved
// away from a directory whose size was being measured. Needed because one stream
// carries every operation for a node, and an abandoned tree walk would otherwise keep
// its disk busy.
message CancelRequest {
  string cancelled_request_id = 1;
}

// Success terminator for an operation with no payload.
message OperationDone {
  // Filled where it is cheap and useful: the number of entries deleted, the number of
  // files extracted. Zero otherwise.
  int64 affected = 1;
  google.protobuf.Timestamp finished_at = 2;
}

enum FileErrorCode {
  FILE_ERROR_CODE_UNSPECIFIED = 0;
  FILE_ERROR_CODE_NOT_FOUND = 1;
  FILE_ERROR_CODE_ALREADY_EXISTS = 2;
  FILE_ERROR_CODE_PERMISSION_DENIED = 3;
  // The resolved path left its root, or an archive entry tried to. Its own code because
  // it is never a customer mistake worth explaining - it is an attack or a bug, and the
  // panel records it in the audit log rather than showing a friendly hint.
  FILE_ERROR_CODE_PATH_ESCAPES_ROOT = 4;
  FILE_ERROR_CODE_NOT_A_DIRECTORY = 5;
  FILE_ERROR_CODE_IS_A_DIRECTORY = 6;
  FILE_ERROR_CODE_DIRECTORY_NOT_EMPTY = 7;
  FILE_ERROR_CODE_QUOTA_EXCEEDED = 8;
  FILE_ERROR_CODE_TOO_LARGE = 9;
  // A chunk or a completed file did not match its SHA-256.
  FILE_ERROR_CODE_CHECKSUM_MISMATCH = 10;
  // The session was swept, never existed, or belongs to another root.
  FILE_ERROR_CODE_UNKNOWN_SESSION = 11;
  FILE_ERROR_CODE_UNSUPPORTED_ARCHIVE = 12;
  // The root id is not in the current NodeSpec.
  FILE_ERROR_CODE_UNKNOWN_ROOT = 13;
  FILE_ERROR_CODE_CANCELLED = 14;
  // Anything the node could not classify, with the underlying message in `detail`.
  FILE_ERROR_CODE_IO_ERROR = 15;
}

message FileError {
  FileErrorCode code = 1;
  // Safe to show the customer. The node writes it for a person, not for a log parser.
  string detail = 2;
  // Which path the operation was on when it failed, relative to the root. An extract
  // that fails on entry 400 of 900 has to say which one.
  string path = 3;
}
