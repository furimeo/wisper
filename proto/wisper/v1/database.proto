// Managed databases: the shared engine containers a node runs, the per-customer
// database and user carved out of one, and the commands that create, re-key and drop
// them.
//
// Shared engines rather than a container per customer because an idle PostgreSQL costs
// 30-50 MB of RSS and a node hosts hundreds of customers; a few hundred private
// instances is the whole machine (design section 8.1). A customer who pays for
// isolation gets `dedicated_instance` and their own container instead of a schema in
// the shared one.
//
// This file imports nothing from wisper.v1 on purpose: workload.proto imports it so a
// NodeSpec can carry the grants, and protobuf has no import cycles.
syntax = "proto3";

package wisper.v1;

option java_package = "lhqm.furimeo.wisper.proto.v1";
option java_multiple_files = true;
option java_outer_classname = "DatabaseProto";
option go_package = "github.com/furimeo/wisper/sasayaki/internal/wisperpb;wisperpb";

import "google/protobuf/timestamp.proto";

// Which engine. The two are not interchangeable anywhere - the dump format, the SQL
// that creates a user and the connection URI scheme all differ - so every message that
// touches a database carries it rather than inferring it from a port or an image name.
enum DatabaseEngine {
  DATABASE_ENGINE_UNSPECIFIED = 0;
  DATABASE_ENGINE_POSTGRES = 1;
  DATABASE_ENGINE_MYSQL = 2;
}

// A shared engine container the node must be running, exactly one per engine per node.
//
// It is part of the NodeSpec rather than something the daemon decides for itself
// because the panel owns intent: two nodes quietly running different major versions is
// a backup that restores everywhere except the node it is needed on.
message DatabaseEngineSpec {
  DatabaseEngine engine = 1;
  // Pinned by the panel, digest or tag. The node never picks a version.
  string image = 2;
  // Published on the node's private interface only. Customers reach it through the
  // connection string the panel shows them; it is never on the public address.
  uint32 listen_port = 3;
  // The superuser the node uses to create databases and roles. The panel generates the
  // password so it can display and rotate it; a secret the node invents is a secret the
  // panel cannot show the customer or put in a backup job.
  string admin_username = 4;
  string admin_password = 5;
  // Where the engine's data directory lives, as a volume id the node resolves under its
  // state directory. Named so a node rebuild keeps customer data.
  string data_volume_id = 6;
  // Deliberately two integers instead of workload.ResourceLimits: workload.proto
  // imports this file, so this file cannot import workload.proto. Duplicating the two
  // fields the engine actually needs is cheaper than moving NodeSpec around to break
  // the cycle.
  int64 nano_cpus = 7;
  int64 memory_bytes = 8;
  // Connection ceiling for the whole shared engine. Without it one customer's leaking
  // pool locks every other customer out of the same container.
  int32 max_connections = 9;
}

// One customer's database and login on a shared engine. Part of the NodeSpec, so a
// daemon that lost its disk recreates the account rather than leaving an application
// unable to log in.
message DatabaseGrant {
  // The panel's id for this grant, stable across renames of the database itself.
  string id = 1;
  DatabaseEngine engine = 2;
  string database_name = 3;
  string username = 4;
  // Storage ceiling in bytes, enforced by measurement and reported back: neither engine
  // has a hard per-database quota, so the panel gets `over_quota` and decides what to do
  // rather than the node silently dropping writes.
  int64 quota_bytes = 5;
  // The paid escape hatch from the shared engine (design section 8.1). The node runs a
  // private container for this grant instead of a role in the shared one.
  bool dedicated_instance = 6;
  // PostgreSQL encoding / MySQL character set. Empty means the engine default; it is
  // here because changing it after a customer has data means a dump and reload.
  string encoding = 7;
}

// Create the database, the role and the grant, now.
//
// A command rather than pure reconciliation because the customer is waiting on a
// screen for a connection string, and because the password must reach the panel in the
// reply that answers this one request.
message ProvisionDatabase {
  DatabaseGrant grant = 1;
  // Generated by the panel, which stores it encrypted and shows it once. The node
  // applies it and never keeps a copy outside the engine.
  string password = 2;
}

// What the panel needs to render a connection string, and nothing else: the password
// came from the panel in the first place, so sending it back would put a secret on the
// wire twice for no gain.
message DatabaseProvisioned {
  string id = 1;
  DatabaseEngine engine = 2;
  // The address a customer's workload uses. The node fills in the address that works
  // from inside its own network, which is not necessarily the node's public one.
  string host = 3;
  uint32 port = 4;
  string database_name = 5;
  string username = 6;
  // Reported so the panel can warn before a dump lands on an engine that cannot read
  // it. "PostgreSQL 17.2", "8.4.3".
  string engine_version = 7;
}

// Change one login's password. The customer pressed "rotate" (design section 8.1), or
// an operator is revoking a leaked credential.
message RotateDatabasePassword {
  string id = 1;
  string username = 2;
  DatabaseEngine engine = 3;
  string new_password = 4;
}

// Remove a database and its login.
//
// `drop_data` is explicit rather than implied because dropping the role and leaving the
// data is a real operation - it locks an application out while an operator investigates
// - and because a destructive default is how customer data disappears.
message DropDatabase {
  string id = 1;
  DatabaseEngine engine = 2;
  string database_name = 3;
  string username = 4;
  bool drop_data = 5;
}

// Measured fact about one grant, reported in every status batch. The panel owns the
// quota; the node owns the size.
message DatabaseStatus {
  string id = 1;
  DatabaseEngine engine = 2;
  // False after a restore that has not finished, or when the engine container is down.
  // The panel shows "unavailable" rather than "deleted": not seeing something is not
  // the same as it not existing.
  bool exists = 3;
  int64 size_bytes = 4;
  int64 quota_bytes = 5;
  // Computed by the node so the panel does not have to re-derive the same comparison in
  // three screens, and so the threshold can move with the engine's own accounting.
  bool over_quota = 6;
  string engine_version = 7;
  google.protobuf.Timestamp measured_at = 8;
  // Why the last provision, rotate or size query failed. Empty when it did not.
  string last_error = 9;
}
