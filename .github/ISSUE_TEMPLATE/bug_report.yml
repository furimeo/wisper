name: Bug report
description: Something behaves differently from what it says it does
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        If this is a security issue, **stop** and use
        [private reporting](../../security/advisories/new) instead. See
        [SECURITY.md](../../blob/main/SECURITY.md).

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, and what happened that should not have.
      placeholder: |
        I stopped a service from its overview page. The panel said it had stopped, but the
        container is still running on the node.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: Where
      options:
        - Panel (wisper)
        - Node daemon (sasayaki)
        - Both, or not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: '`sasayaki version`, or the jar you are running.'
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: The node it happened on
      description: |
        `sasayaki doctor` output is ideal - it answers most of this at once, and it changes
        nothing. Otherwise: OS, kernel, Docker version, whether `runsc` is registered, and
        the filesystem under `/var/lib/wisper`.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        The panel's log around the failure, and the daemon's if the node was involved.
        Redact tokens and credentials - the daemon does not log them, but your shell history
        might have put one in.
      render: text
