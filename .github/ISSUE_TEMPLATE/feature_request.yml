name: Feature request
description: Something the platform should be able to do and cannot
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Some things are deliberately absent. Before writing, check the "Deliberately not
        built" list in the [README](../../blob/main/README.md): Kubernetes, DNS automation,
        billing, multi-region, and SSH/SFTP are choices rather than gaps. Arguing one of
        them should change is welcome - just make the argument.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: |
        What you were trying to do, and what stopped you. Not the solution yet - the
        situation. A good one names who is stuck: an operator draining a node, a customer
        who cannot recover a file.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you think should happen
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered instead
      description: Including doing it by hand, and why that is not good enough.

  - type: dropdown
    id: who
    attributes:
      label: Who is this for
      options:
        - A hosting customer
        - A platform operator
        - Someone deploying wisper itself
        - A contributor
    validations:
      required: true
